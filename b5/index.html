<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Các bài thực hành JavaScript cho website Blakletterpress.">
  <title>Bài 5 — JavaScript | Bài tập Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      font-family: Inter, sans-serif;
      background: #07070f;
      color: #e8e8f0;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 15% 0%, rgba(52, 211, 153, .12), transparent 45%), #07070f;
    }

    main {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    .back-link {
      color: #a5b4fc;
      font-size: 14px;
      text-decoration: none;
    }

    .back-link:hover {
      color: #d1fae5;
    }

    .eyebrow {
      margin: 48px 0 12px;
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.1;
    }

    .intro {
      max-width: 600px;
      margin: 16px 0 36px;
      color: #a1a1b5;
      line-height: 1.7;
    }

    .assignments {
      display: grid;
      gap: 12px;
    }

    .assignment {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 112px;
      padding: 22px 24px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
      color: inherit;
      text-decoration: none;
      transition: border-color .18s, transform .18s, background .18s;
    }

    .assignment:hover {
      transform: translateY(-2px);
      border-color: rgba(110, 231, 183, .55);
      background: rgba(255, 255, 255, .06);
    }

    .assignment:focus-visible,
    .back-link:focus-visible {
      outline: 2px solid #6ee7b7;
      outline-offset: 4px;
    }

    .number {
      display: block;
      margin-bottom: 7px;
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
    }

    .arrow {
      flex: 0 0 auto;
      color: #6ee7b7;
      font-size: 22px;
    }

    @media (max-width: 520px) {
      main {
        padding-top: 36px;
      }

      .assignment {
        min-height: 96px;
        padding: 18px;
      }

      h2 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../">&larr; Trang chủ</a>
    <p class="eyebrow">Bài 5 · JavaScript</p>
    <h1>Các bài thực hành</h1>
    <p class="intro">Chọn một bài thực hành JavaScript trên website Blakletterpress.</p>

    <nav class="assignments" aria-label="Các bài thực hành Bài 5">
      <a class="assignment" href="./Bai%20tap%201%20-%20JS%20phieu%20bao%20gia%20va%20xac%20nhan%20don%20in/index.html">
        <span>
          <span class="number">Bài 1</span>
          <h2>Phiếu báo giá và xác nhận đơn in</h2>
        </span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a class="assignment" href="./Bai%20tap%202%20-%20JS%20tin%20tuc%20va%20gio%20hang/index.html">
        <span>
          <span class="number">Bài 2</span>
          <h2>Tin tức và giỏ hàng</h2>
        </span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a class="assignment" href="./Bai%20tap%203%20-%20JS%20thu%20vien%20anh%20va%20tin%20nhanh/index.html">
        <span>
          <span class="number">Bài 3</span>
          <h2>Thư viện ảnh và tin nhanh</h2>
        </span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
    </nav>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>Responsive Web Design Demo</title>
    <style>
        .container {
            font-family: sans-serif;
            margin: 0 auto; /* Căn giữa */
            padding: 20px;
            width: 90%;
        }

        .content {
            display: flex;
            flex-wrap: wrap; /* Cho phép các cột xuống dòng khi không đủ chỗ */
        }

        .col1 { background: crimson; }
        .col2 { background: seagreen; }
        .col3 { background: steelblue; }

        .column {
            flex: 1; /* Mỗi cột chiếm một phần bằng nhau */
            padding: 15px;
            border: 1px solid #ddd;
            margin: 10px;
            box-sizing: border-box; /* Đảm bảo padding không làm tăng kích thước cột */

        }

        /* 2. Media Queries (Thiết kế cho các kích thước màn hình cụ thể) */

        /* Cho màn hình lớn (Máy tính để bàn - ví dụ: rộng hơn 1024px) */
        @media (min-width: 993px) {
            .column {
                min-width: 300px;
            }
        }

        /* Cho màn hình trung bình (Máy tính bảng - ví dụ: từ 600px đến 1023px) */
        @media (min-width: 577px) and (max-width: 992px) {
            .column {
                flex: 0 0 45%; /* Chiếm khoảng 45% chiều rộng, tạo 2 cột */
                margin: 10px;
            }
        }

        /* Cho màn hình nhỏ (Điện thoại - ví dụ: nhỏ hơn 768px) */
        @media (max-width: 576px) {
            .column {
                flex: 0 0 90%; /* Chiếm toàn bộ chiều rộng, tạo 1 cột xếp chồng */
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="column col1">Column 1</div>
            <div class="column col2">Column 2</div>
            <div class="column col3">Column 3</div>
        </div>
  </div>
</body>
</html>
